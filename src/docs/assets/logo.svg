<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  width="256"
  height="256"
  role="img"
  aria-label="Tsir"
>
  <title>Tsir</title>
  <defs>
    <linearGradient id="tsir-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="tsir-mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="256" height="256" rx="58" fill="url(#tsir-bg)" />

  <!-- Orbit: the circle in the name (ծիր), drawn as a quiet ring -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="9" />
  <circle cx="128" cy="42" r="11" fill="#ffffff" fill-opacity="0.85" />

  <!-- Monogram: a T whose stem ends in a node -->
  <path d="M76 96h104" stroke="url(#tsir-mark)" stroke-width="24" stroke-linecap="round" />
  <path d="M128 96v74" stroke="url(#tsir-mark)" stroke-width="24" stroke-linecap="round" />
  <circle cx="128" cy="188" r="17" fill="url(#tsir-mark)" />
</svg>
