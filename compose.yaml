# Local Postgres for `make db-up` (DXS-009). Bound to 127.0.0.1 on the documented port (5432).
# The password is never written here: it comes from POSTGRES_PASSWORD in .env or the shell.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: tsir
      POSTGRES_DB: tsir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or the shell}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tsir -d tsir']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data: {}
